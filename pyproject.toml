[project]
name = "var-confidence-audit"
version = "0.1.0"
description = "Do banks trading VaR models hold up? Their own backtesting exceptions from 10-K filings, 2006 to 2025"
requires-python = ">=3.11"
dependencies = [
    'numpy==2.1.3',
    'pandas==2.2.3',
    'scipy==1.14.1',
    'matplotlib==3.9.4'
]

[dependency-groups]
dev = ["pytest>=7.4"]

[tool.uv]
package = false
